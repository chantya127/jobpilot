[project]
name = "jobpilot"
version = "0.1.0"
description = "Local dashboard + Claude Code agents that apply to jobs for you, with you in control."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "playwright>=1.44",
]

[project.scripts]
jobpilot = "jobpilot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobpilot"]

[tool.hatch.build.targets.wheel.force-include]
"engine" = "jobpilot/engine"
